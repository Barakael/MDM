# Host nginx — listens on 172.22.1.1:8088 / 127.0.0.1:8088 (same pattern as wayda.co.tz)
# Mailcow terminates HTTPS and proxies here.

server {
    listen 127.0.0.1:8088;
    listen 172.22.1.1:8088;
    server_name mdm.wayda.co.tz;

    root /var/www/mdm.wayda.co.tz/frontend/dist;
    index index.html;
    client_max_body_size 20M;

    # Laravel enrollment profile download
    location ^~ /mdm/enroll {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Apple MDM check-in / connect → NanoMDM
    location /mdm {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # SCEP identity enrollment
    location /scep {
        proxy_pass http://127.0.0.1:8080/scep;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Laravel API + webhooks
    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
